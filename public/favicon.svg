<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
	<defs>
		<radialGradient id="bg-glow" cx="50%" cy="42%" r="65%">
			<stop offset="0%" stop-color="#360B05" />
			<stop offset="55%" stop-color="#1B0502" />
			<stop offset="100%" stop-color="#110201" />
		</radialGradient>
		<linearGradient id="border-gold" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#F7E6CA" stop-opacity="0.75" />
			<stop offset="50%" stop-color="#F29F38" stop-opacity="0.95" />
			<stop offset="100%" stop-color="#9A4B12" stop-opacity="0.65" />
